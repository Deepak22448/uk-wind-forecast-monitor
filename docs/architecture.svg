<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 1248 648" width="1248" height="648" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<!-- Logo marks from Simple Icons (CC0). Trademarks belong to their respective owners. -->
<title id="t">UK Wind Forecast Monitor architecture</title>
<desc id="d">Three layers. A data ingestion layer downloads Elexon wind actuals and forecasts once and saves a snapshot in the repo. A FastAPI service on Render loads that snapshot, picks the latest forecast available at the decision cutoff, compares it with actuals and computes error metrics. A React app on Vercel requests them as JSON.</desc>
